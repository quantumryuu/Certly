# Certly with Docker Compose.
#   docker compose up -d        then open http://localhost:8080
# Optional: set CERTLY_BASE_URL (before issuing certificates) if clients should
# find the CRL address inside the certificates. See the README.
services:
  certly:
    image: ghcr.io/quantumryuu/certly:latest
    build: .
    container_name: certly
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      CERTLY_LISTEN: ":8080"
      # CERTLY_BASE_URL: "https://certly.lan"     # optional, see README
      # CERTLY_SECURE_COOKIES: "true"             # if a TLS reverse proxy is in front
      # CERTLY_TRUSTED_PROXIES: "172.16.0.0/12"   # if behind a reverse proxy
      # CERTLY_ALLOWED_ORIGINS: "http://192.168.1.10:8080"  # if you see "Request blocked"
      # CERTLY_LOG_FORMAT: json
    volumes:
      - certly-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

volumes:
  certly-data:
