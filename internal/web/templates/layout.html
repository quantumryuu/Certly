<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true,"historyCacheSize":0}'>
  <title>{{if .Title}}{{.Title}} · {{end}}Certly</title>
  <link rel="stylesheet" href="/static/pico.min.css">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><a href="/" class="brand"><img src="/static/favicon.svg" alt="" width="22" height="22"> Certly</a></li></ul>
      {{if .User}}
      <ul>
        <li><a href="/" {{if eq .Nav "dashboard"}}aria-current="page"{{end}}>Dashboard</a></li>
        <li><a href="/cas" {{if eq .Nav "cas"}}aria-current="page"{{end}}>CAs</a></li>
        <li><a href="/certs" {{if eq .Nav "certs"}}aria-current="page"{{end}}>Certificates</a></li>
        <li><a href="/import" {{if eq .Nav "import"}}aria-current="page"{{end}}>Import</a></li>
        <li><a href="/audit" {{if eq .Nav "audit"}}aria-current="page"{{end}}>Audit</a></li>
        <li><a href="/settings" {{if eq .Nav "settings"}}aria-current="page"{{end}}>Settings</a></li>
        <li>
          <form method="post" action="/logout" class="inline">
            <input type="hidden" name="csrf" value="{{.CSRF}}">
            <button type="submit" class="secondary outline small">Sign out</button>
          </form>
        </li>
      </ul>
      {{end}}
    </nav>
  </header>
  <main class="container">
    {{if .Flash}}<p class="notice ok" role="status">{{.Flash}}</p>{{end}}
    {{if .Error}}<p class="notice err" role="alert">{{.Error}}</p>{{end}}
    {{template "content" .}}
  </main>
  <footer class="container muted small">Certly {{.Version}} · all times UTC</footer>
</body>
</html>
